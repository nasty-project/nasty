name: Build NASty ISO

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag like v0.0.1, branch, or leave empty for HEAD)'
        required: false
        default: ''
      architecture:
        description: 'Build both ISOs, or just one architecture (x86_64 for legacy BIOS testing)'
        type: choice
        options: [both, x86_64, aarch64]
        default: both

jobs:
  build-iso:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'both' && '["x86_64","aarch64"]' || format('["{0}"]', inputs.architecture)) }}
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-tags: true

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Compute npm deps hash
        run: |
          HASH=$(nix run nixpkgs#prefetch-npm-deps -- webui/package-lock.json 2>/dev/null)
          echo "Computed npmDepsHash: $HASH"
          sed -i "s|npmDepsHash = \".*\"|npmDepsHash = \"$HASH\"|" flake.nix
          git add flake.nix
          echo "Updated flake.nix with hash: $HASH"

      - name: Build ${{ matrix.arch }} ISO
        run: |
          set -o pipefail
          nix build .#nixosConfigurations.${{ matrix.arch == 'x86_64' && 'nasty-iso' || 'nasty-iso-aarch64' }}.config.system.build.isoImage \
            --no-link --print-out-paths -L 2>&1 | tee /tmp/build.log
          grep -a '^/nix/store' /tmp/build.log | tail -1 > /tmp/iso-path.txt
          cat /tmp/iso-path.txt

      - name: Prepare ISO
        run: |
          set -euo pipefail
          ISO_DIR=$(cat /tmp/iso-path.txt)
          ISO_FILE=$(find "$ISO_DIR" -name "*.iso" -type f | head -1)
          echo "ISO: $ISO_FILE"
          ISO_BYTES=$(stat -c%s "$ISO_FILE")
          echo "ISO size: $ISO_BYTES bytes (GitHub asset limit: 2147483648 bytes)"

          # Use the input ref if it looks like a version tag, otherwise commit-based
          INPUT_REF="${{ inputs.ref }}"
          if [[ "$INPUT_REF" == v* ]]; then
            VERSION="$INPUT_REF"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          DEST="nasty-${VERSION}-${{ matrix.arch }}.iso"
          if [ "$ISO_BYTES" -ge 2147483648 ]; then
            # Never discard appliance tools to satisfy an upload limit.
            # Smaller release assets reassemble to the byte-identical ISO.
            split -b 1500M -d -a 2 "$ISO_FILE" "${DEST}.part-"
            HASH=$(sha256sum "$ISO_FILE")
            printf '%s  %s\n' "${HASH%% *}" "$DEST" > "${DEST}.sha256"
            echo "iso_split=true" >> "$GITHUB_ENV"
            echo "ISO exceeds the per-asset limit; uploading split parts and SHA-256 manifest."
          else
            cp "$ISO_FILE" "$DEST"
            echo "iso_split=false" >> "$GITHUB_ENV"
          fi
          echo "iso_dest=$DEST" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Upload as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ env.version }}"
          DEST="${{ env.iso_dest }}"
          if [ "${{ env.iso_split }}" = true ]; then
            ASSETS=( "${DEST}".part-* "${DEST}.sha256" )
          else
            ASSETS=( "$DEST" )
          fi
          if gh release view "$TAG" &>/dev/null; then
            # Existing release — only upload the asset. Don't touch the
            # prerelease flag so manually-promoted releases stay promoted
            # if the workflow is re-run for the same tag.
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            # All freshly-created releases start as prereleases — including
            # tagged v* releases. The maintainer downloads the ISO, tests
            # it, writes release notes, and then flips "Set as latest" in
            # the GitHub Releases UI to promote it.
            if ! gh release create "$TAG" "${ASSETS[@]}" \
              --title "NASty $TAG" \
              --notes "NASty ISO build — $(git rev-parse --short HEAD).

          For split ISOs, download all matching .part-* assets and the .sha256 manifest. Set ISO to the filename ending in .iso, then run: cat \"\$ISO\".part-* > \"\$ISO\" && sha256sum -c \"\$ISO.sha256\"" \
              --prerelease; then
              # Both architecture jobs may try to create the same release.
              gh release view "$TAG" >/dev/null
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
            fi
          fi
