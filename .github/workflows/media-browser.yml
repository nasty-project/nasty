name: Media browser regression

on:
  pull_request:
    paths:
      - 'webui/src/lib/media-*.ts'
      - 'webui/src/lib/components/MediaPreview.svelte'
      - 'webui/src/routes/share/**'
      - 'tests/media-browser/**'
      - '.github/workflows/media-browser.yml'
  workflow_dispatch:
    inputs:
      android:
        description: Run real Firefox on an Android 16 emulator
        type: boolean
        default: true
      firefox_version:
        description: Mozilla Android release version
        type: string
        default: '152.0'

permissions:
  contents: read

concurrency:
  group: media-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Media playback (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            container: mp4
          - browser: firefox
            container: mkv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg pulseaudio
      - name: Virtual audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=media_test
          pactl set-default-sink media_test
      - run: npm ci --legacy-peer-deps
        working-directory: webui
      - run: npm run build
        working-directory: webui
      - run: npm ci && npm run test:unit && npx playwright-core install --with-deps ${{ matrix.browser }} && npm run fixtures
        working-directory: tests/media-browser
      - name: Steady playback and main-thread stalls
        working-directory: tests/media-browser
        run: npm test -- --browser=${{ matrix.browser }} --container=${{ matrix.container }} --main-thread-stall-ms=350
      - name: Network jitter and native video recovery
        working-directory: tests/media-browser
        run: npm test -- --browser=${{ matrix.browser }} --container=${{ matrix.container }} --scenario=network-jitter --delay-ms=150 --expect-video-buffering
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: media-${{ matrix.browser }}
          path: tests/media-browser/results/

  android:
    name: Firefox on Android 16
    if: github.event_name == 'workflow_dispatch' && inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg pulseaudio
      - name: Virtual audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=media_test
          pactl set-default-sink media_test
      - run: npm ci --legacy-peer-deps && npm run build
        working-directory: webui
      - run: npm ci && npm run fixtures
        working-directory: tests/media-browser
      - name: Download pinned geckodriver and official Firefox APK
        env:
          FIREFOX_VERSION: ${{ inputs.firefox_version }}
        run: |
          [[ "$FIREFOX_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || exit 1
          curl --fail --location --retry 3 "https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          curl --fail --location --retry 3 "https://archive.mozilla.org/pub/fenix/releases/$FIREFOX_VERSION/android/fenix-$FIREFOX_VERSION-android-x86_64/fenix-$FIREFOX_VERSION.multi.android-x86_64.apk" -o "$RUNNER_TEMP/firefox.apk"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android Firefox playback suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: |
            adb install "$RUNNER_TEMP/firefox.apk"
            adb shell am set-debug-app --persistent org.mozilla.firefox
            adb reverse tcp:8787 tcp:8787
            "$RUNNER_TEMP/geckodriver" --host 127.0.0.1 --port 4444 --android-storage=sdcard > tests/media-browser/results-geckodriver.log 2>&1 &
            npm --prefix tests/media-browser run test:android -- --container=mp4 --codecs=ac3,eac3 --seconds=15
            npm --prefix tests/media-browser run test:android -- --container=mp4 --codecs=ac3,eac3 --seconds=15 --scenario=network-jitter --delay-ms=150 --expect-video-buffering
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: media-android-firefox
          path: |
            tests/media-browser/results/
            tests/media-browser/results-geckodriver.log
